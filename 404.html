<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>404 · Paint Studio</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="https://robertlib.github.io/paint/favicon.svg" />
    <meta name="theme-color" content="#0e0f14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)" />
    <script>
      (function () {
        var choice = null;
        try {
          var p = JSON.parse(localStorage.getItem("paint-studio:prefs:v2") || "null");
          if (p && (p.themeChoice === "light" || p.themeChoice === "dark")) choice = p.themeChoice;
        } catch (e) {}
        var light = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = choice || (light ? "light" : "dark");
        if (choice) {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].content = choice === "light" ? "#f4f5f9" : "#0e0f14";
        }
      })();
    </script>
    <link rel="stylesheet" href="https://robertlib.github.io/paint/css/tokens.css" />
    <link rel="stylesheet" href="https://robertlib.github.io/paint/css/site.css" />
  </head>
  <body class="site">
    <main><section class="hero" lang="en">
        <h1>Page not found</h1>
        <p class="lead">This page doesn’t exist or has moved. The editor and all the tools are still one click away.</p>
        <p><a class="btn btn-primary btn-lg" href="https://robertlib.github.io/paint/">Back to Paint Studio</a></p>
      </section>
<section class="hero" lang="cs">
        <h1>Stránka nenalezena</h1>
        <p class="lead">Tahle stránka neexistuje, nebo byla přesunuta. Editor i všechny nástroje ale fungují dál.</p>
        <p><a class="btn btn-primary btn-lg" href="https://robertlib.github.io/paint/cs/">Zpět na úvodní stránku</a></p>
      </section></main>
  </body>
</html>
